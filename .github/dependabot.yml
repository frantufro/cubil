version: 2
updates:
  # `cubil update` downloads and extracts a release tarball over the running
  # binary, so advisories in ureq, tar and flate2 land on that path.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The lint job pins its toolchain on purpose, and this action tags
      # versions ahead of the rustc releases they name: dependabot proposed
      # 1.100.0, which rustup answers with a 404. Move that pin by hand when a
      # new stable is actually out.
      - dependency-name: dtolnay/rust-toolchain
